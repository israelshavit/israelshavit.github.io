<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Link Hub</title>
<meta name="description" content="All my apps and sites in one place.">
<meta property="og:title" content="My Link Hub">
<meta property="og:description" content="All my apps and sites in one place.">
<meta name="theme-color" content="#0b1f2a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1f2a'/%3E%3Cpath d='M13 19l6-6M11.5 15.5l-2 2a3.5 3.5 0 005 5l2-2M20.5 16.5l2-2a3.5 3.5 0 00-5-5l-2 2' stroke='%2367d4c9' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: dark ink hero band with title + stats, then a search bar and a two-column grid of link cards on a light ground. */
:root {
  --ink: #0b1f2a;
  --ink-2: #12303f;
  --on-ink: #e9f3f5;
  --on-ink-muted: #9db4bd;
  --bg: #f4f6f8;
  --surface: #ffffff;
  --fg: #142029;
  --muted: #5d6b76;
  --line: #e1e6ea;
  --accent: #0e7c7b;
  --accent-bright: #67d4c9;
  --shadow: 0 1px 2px rgba(11,31,42,.06), 0 4px 14px rgba(11,31,42,.05);
  --shadow-hover: 0 2px 4px rgba(11,31,42,.08), 0 12px 28px rgba(11,31,42,.10);
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d151a; --surface: #152129; --fg: #e6edf1; --muted: #93a3ad; --line: #22323c;
    --accent: #5cc8bd; --ink: #08161e; --ink-2: #0f2733;
    --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-hover: 0 10px 28px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
.inner { max-width: 960px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left)); padding-right: max(20px, env(safe-area-inset-right)); }

/* Hero */
.hero { background: radial-gradient(1200px 400px at 85% -20%, var(--ink-2), transparent 60%), var(--ink); color: var(--on-ink); padding-block: 64px 88px; }
.hero .inner { display: flex; flex-direction: column; gap: 14px; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-bright); }
.brand svg { width: 22px; height: 22px; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(36px, 7vw, 56px); line-height: 1.02; letter-spacing: -.025em; margin: 0; text-wrap: balance; }
.lede { color: var(--on-ink-muted); font-size: 17px; max-width: 46ch; margin: 0; }
.stats { display: flex; flex-wrap: wrap; gap: 28px; margin-top: 10px; }
.stat { display: flex; flex-direction: column; }
.stat b { font-family: var(--display); font-size: 26px; font-weight: 600; color: var(--on-ink); font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--on-ink-muted); }

/* Content */
main.inner { margin-top: -44px; padding-bottom: 72px; display: flex; flex-direction: column; gap: 28px; }
.search { position: relative; }
.search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.search input { width: 100%; font: inherit; font-size: 16px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 16px 16px 46px; box-shadow: var(--shadow); }
.search input::placeholder { color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.search input:focus-visible { outline-offset: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 500 13px var(--body); border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.chip .n { font-family: var(--mono); font-size: 11px; opacity: .65; margin-left: 6px; }

section.group { display: flex; flex-direction: column; gap: 14px; }
.group-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
h2 { font-family: var(--display); font-size: 15px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; margin: 0; color: var(--muted); }
.group-head .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }

.grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.card { position: relative; display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card:hover { box-shadow: var(--shadow-hover); border-color: transparent; }
@media (prefers-reduced-motion: no-preference) { .card { transition: box-shadow .2s, transform .2s, border-color .2s; } .card:hover { transform: translateY(-2px); } }
.tile { flex: none; width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; font: 700 20px var(--display); color: #fff; text-transform: uppercase; }
.body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.name { font-family: var(--display); font-weight: 600; font-size: 17px; color: var(--fg); text-decoration: none; line-height: 1.25; overflow-wrap: anywhere; }
.name::after { content: ""; position: absolute; inset: 0; border-radius: 14px; }
.meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.host { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tag { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); padding: 2px 7px; border-radius: 5px; }
.note { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.side { position: relative; z-index: 1; flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.arrow { width: 20px; height: 20px; color: var(--muted); pointer-events: none; }
.card:hover .arrow { color: var(--accent); }
.copy { font: 500 12px var(--body); cursor: pointer; border-radius: 6px; background: transparent; border: 1px solid var(--line); color: var(--muted); padding: 3px 8px; }
.copy:hover { color: var(--fg); border-color: var(--muted); }

.empty { border: 1px dashed var(--line); border-radius: 14px; padding: 32px 20px; text-align: center; color: var(--muted); background: var(--surface); }
.empty strong { display: block; color: var(--fg); font-family: var(--display); font-size: 17px; margin-bottom: 4px; }
footer { border-top: 1px solid var(--line); }
footer .inner { padding-block: 22px 32px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<header class="hero">
  <div class="inner">
    <span class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 14l4-4M8.5 11.5l-1.8 1.8a3.2 3.2 0 004.5 4.5l1.8-1.8M15.5 12.5l1.8-1.8a3.2 3.2 0 00-4.5-4.5l-1.8 1.8"/></svg>Link Hub</span>
    <h1>My Link Hub</h1>
    <p class="lede">All my apps and sites in one place. Pick one to open it.</p>
    <div class="stats" id="stats" aria-live="polite"></div>
  </div>
</header>

<main id="app" class="inner">
  <div class="empty"><strong>Loading links…</strong></div>
</main>

<footer>
  <div class="inner">
    <span>&copy; <span id="year">2026</span> My Link Hub</span>
    <span>israelshavit.github.io</span>
  </div>
</footer>

<script>
(function () {
  var app = document.getElementById("app");
  var statsEl = document.getElementById("stats");
  document.getElementById("year").textContent = new Date().getFullYear();
  var links = [];
  var ui = { query: "", group: "" };

  var PALETTE = ["#0e7c7b", "#2f5fd0", "#7a4fd6", "#c2410c", "#0f766e", "#b4235a", "#4d7c0f", "#a16207"];
  var HOSTS = [
    [/\.github\.io$/, "GitHub Pages"], [/\.netlify\.app$/, "Netlify"], [/\.vercel\.app$/, "Vercel"],
    [/\.onrender\.com$/, "Render"], [/\.pages\.dev$/, "Cloudflare"], [/\.web\.app$|\.firebaseapp\.com$/, "Firebase"]
  ];

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "class") n.className = attrs[k];
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  function svg(path) {
    var s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor");
    s.setAttribute("stroke-width", "2"); s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round");
    s.setAttribute("aria-hidden", "true"); s.setAttribute("class", "arrow");
    var p = document.createElementNS("http://www.w3.org/2000/svg", "path"); p.setAttribute("d", path); s.appendChild(p);
    return s;
  }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : null; }
  function host(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return u; } }
  function platform(h) { for (var i = 0; i < HOSTS.length; i++) if (HOSTS[i][0].test(h)) return HOSTS[i][1]; return "Custom domain"; }
  function color(name) { var h = 0; for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0; return PALETTE[h % PALETTE.length]; }
  function initials(name) {
    var w = String(name).replace(/[^\p{L}\p{N} ]/gu, " ").trim().split(/\s+/);
    return ((w[0] || "?")[0] + (w.length > 1 ? w[1][0] : "")).toUpperCase();
  }
  function groupOf(l) { return (l.group || "").trim() || "My Apps"; }
  function groups() {
    var order = [], counts = {};
    links.forEach(function (l) { var g = groupOf(l); if (!(g in counts)) { counts[g] = 0; order.push(g); } counts[g]++; });
    return order.map(function (g) { return { name: g, count: counts[g] }; });
  }

  function renderStats() {
    statsEl.textContent = "";
    var platforms = {};
    links.forEach(function (l) { platforms[platform(host(l.url))] = 1; });
    [[links.length, links.length === 1 ? "Link" : "Links"], [groups().length, groups().length === 1 ? "Collection" : "Collections"], [Object.keys(platforms).length, "Platforms"]]
      .forEach(function (s) { statsEl.appendChild(el("div", { class: "stat" }, [el("b", { text: String(s[0]) }), el("span", { text: s[1] })])); });
  }

  function card(l) {
    var href = safeUrl(l.url), h = host(l.url);
    var copy = el("button", { type: "button", class: "copy", "aria-label": "Copy address of " + l.name, onclick: function (e) {
      var b = e.currentTarget;
      try { navigator.clipboard.writeText(l.url).then(function () { b.textContent = "Copied"; setTimeout(function () { b.textContent = "Copy"; }, 1400); }, function () {}); } catch (err) {}
    } }, ["Copy"]);
    var tile = el("span", { class: "tile", "aria-hidden": "true", text: initials(l.name) });
    tile.style.background = color(l.name);
    return el("li", { class: "card" }, [
      tile,
      el("div", { class: "body" }, [
        href ? el("a", { class: "name", href: href, target: "_blank", rel: "noopener", text: l.name }) : el("span", { class: "name", text: l.name }),
        el("div", { class: "meta" }, [el("span", { class: "host", text: h }), el("span", { class: "tag", text: platform(h) })]),
        l.note ? el("span", { class: "note", text: l.note }) : null
      ]),
      el("div", { class: "side" }, [svg("M7 17L17 7M8 7h9v9"), copy])
    ]);
  }

  function render() {
    var active = document.activeElement && document.activeElement.id;
    var caret = active === "q" ? document.activeElement.selectionStart : null;
    app.textContent = "";
    if (!links.length) {
      app.appendChild(el("div", { class: "empty" }, [el("strong", { text: "No links yet" }), "Links will appear here once they are added."]));
      return;
    }
    var gs = groups();
    var search = el("div", { class: "search" });
    search.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
    var q = el("input", { id: "q", type: "search", placeholder: "Search my links", "aria-label": "Search my links", autocomplete: "off", oninput: function (e) { ui.query = e.target.value; render(); } });
    q.value = ui.query;
    search.appendChild(q);
    app.appendChild(search);

    if (gs.length > 1) {
      app.appendChild(el("div", { class: "chips", role: "group", "aria-label": "Filter by collection" },
        [{ name: "", label: "All", count: links.length }].concat(gs.map(function (g) { return { name: g.name, label: g.name, count: g.count }; })).map(function (g) {
          return el("button", { type: "button", class: "chip", "aria-pressed": String(ui.group === g.name), onclick: function () { ui.group = g.name; render(); } }, [g.label, el("span", { class: "n", text: String(g.count) })]);
        })));
    }

    var needle = ui.query.trim().toLowerCase(), shown = 0;
    gs.forEach(function (g) {
      if (ui.group && ui.group !== g.name) return;
      var items = links.filter(function (l) {
        return groupOf(l) === g.name && (!needle || [l.name, l.url, l.note, l.group].join(" ").toLowerCase().indexOf(needle) !== -1);
      });
      if (!items.length) return;
      shown += items.length;
      app.appendChild(el("section", { class: "group" }, [
        el("div", { class: "group-head" }, [el("h2", { text: g.name }), el("span", { class: "n", text: items.length + (items.length === 1 ? " link" : " links") })]),
        el("ul", { class: "grid" }, items.map(card))
      ]));
    });
    if (!shown) app.appendChild(el("div", { class: "empty" }, [el("strong", { text: "No matches" }), "Try a different word or pick All."]));

    if (active) {
      var again = document.getElementById(active);
      if (again) { again.focus(); if (caret != null) try { again.setSelectionRange(caret, caret); } catch (e) {} }
    }
  }

  fetch("links.json", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      links = Array.isArray(data) ? data.filter(function (l) { return l && l.name && l.url; }) : [];
      renderStats(); render();
    })
    .catch(function () {
      app.textContent = "";
      app.appendChild(el("div", { class: "empty" }, [el("strong", { text: "Links could not load" }), "Refresh the page to try again."]));
    });
})();
</script>
</body>
</html>
